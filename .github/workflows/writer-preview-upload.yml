name: Writer trusted preview upload
on:
  workflow_run:
    workflows: ['Writer preview build']
    types: [completed]
    branches: ['preview/**']
permissions:
  contents: read
  actions: read
jobs:
  resolve:
    if: github.repository == 'Command-N/aaronnichol.com' && github.ref == 'refs/heads/main' && vars.WRITER_PREVIEW_AUTOMATION_ENABLED == 'true' && github.event.workflow_run.conclusion == 'success' && github.event.workflow_run.event == 'push'
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    outputs:
      branch: ${{ steps.resolve.outputs.branch }}
      sha: ${{ steps.resolve.outputs.sha }}
      run_id: ${{ steps.resolve.outputs.run_id }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '22.16.0'
      - id: resolve
        run: node scripts/writer-previews/scripts/preview.mjs resolve-upload
        env:
          GH_TOKEN: ${{ github.token }}
  upload:
    needs: resolve
    environment: writer-previews
    concurrency:
      group: writer-preview-project
      queue: max
      cancel-in-progress: false
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '22.16.0'
      - name: Download and validate data artifact
        run: python3 scripts/writer-previews/scripts/artifacts.py download --config scripts/writer-previews/preview-config.json --destination "$RUNNER_TEMP/writer-static" --run-id "$SOURCE_RUN" --sha "$PREVIEW_SHA"
        env:
          GH_TOKEN: ${{ github.token }}
          SOURCE_RUN: ${{ needs.resolve.outputs.run_id }}
          PREVIEW_SHA: ${{ needs.resolve.outputs.sha }}
      - name: Install pinned upload tooling without credentials
        run: npm install --prefix "$RUNNER_TEMP/writer-tools" --no-save --ignore-scripts --no-audit --no-fund wrangler@4.135.0
      - name: Upload static files after rechecking branch and commit
        run: node scripts/writer-previews/scripts/preview.mjs upload
        env:
          GH_TOKEN: ${{ github.token }}
          STATIC_DIRECTORY: ${{ runner.temp }}/writer-static
          CLOUDFLARE_PREVIEW_ACCOUNT_ID: ${{ vars.CLOUDFLARE_PREVIEW_ACCOUNT_ID }}
          CLOUDFLARE_PREVIEW_PROJECT: ${{ vars.CLOUDFLARE_PREVIEW_PROJECT }}
          CLOUDFLARE_PREVIEW_EDIT_TOKEN: ${{ secrets.CLOUDFLARE_PREVIEW_EDIT_TOKEN }}
